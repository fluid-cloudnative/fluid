apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-create
spec:
  template:
    spec:
      containers:
      # mc is no longer published either, so create the bucket with a signed S3 request.
      # The curl in the MinIO image predates --aws-sigv4, hence curl's own image.
      - name: create-bucket
        image: curlimages/curl:8.22.0
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: "512Mi"
        command:
          - /bin/sh
          - -c
          - "curl -sSf -X PUT --aws-sigv4 aws:amz:us-east-1:s3 --user $MINIO_ROOT_USER:$MINIO_ROOT_PASSWORD http://minio:9000/test"
        env:
        # Minio access key and secret key
        - name: MINIO_ROOT_USER
          value: "minioadmin"
        - name: MINIO_ROOT_PASSWORD
          value: "minioadmin"
      restartPolicy: OnFailure
  backoffLimit: 4
