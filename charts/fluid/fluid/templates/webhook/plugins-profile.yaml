{{ if .Values.webhook.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-plugins
  namespace: {{ include "fluid.namespace" . }}
data:
  pluginsProfile: |
{{- if .Values.webhook.forceReplacePluginsProfile }}
{{ toYaml .Values.webhook.pluginsProfile | indent 4 }}
{{- else }}
{{- $existing := (lookup "v1" "ConfigMap" (include "fluid.namespace" .)  "webhook-plugins") }}
{{- $existingProfile := "" }}
{{- if $existing }}
{{- $existingProfile = dig "data" "pluginsProfile" "" $existing }}
{{- end }}
{{- if $existingProfile }}
{{- /*
  Keep the existing profile, but add plugin groups introduced after it was written
  (e.g. clientless), otherwise their webhook rules match pods while no plugin runs.
  A profile whose plugins are not a map is not something this template can merge
  into, so it is kept as it is.
*/}}
{{- $profile := fromYaml $existingProfile }}
{{- $plugins := get $profile "plugins" }}
{{- if and (not (hasKey $profile "Error")) (kindIs "map" $plugins) (not (hasKey $plugins "clientless")) }}
{{- $_ := set $plugins "clientless" .Values.webhook.pluginsProfile.plugins.clientless }}
{{ toYaml $profile | indent 4 }}
{{- else }}
{{- /*
  The stored profile ends with the newline the block scalar keeps. Drop it, or indent
  turns it into a whitespace-only line and the checksum on the webhook changes once.
  Only that newline goes: a profile indented as a whole must keep its first line's indent.
*/}}
{{ $existingProfile | trimSuffix "\n" | indent 4 }}
{{- end }}
{{- else }}
{{ toYaml .Values.webhook.pluginsProfile | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
