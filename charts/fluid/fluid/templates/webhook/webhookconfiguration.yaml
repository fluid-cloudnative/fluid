{{ if .Values.webhook.enabled -}}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: fluid-pod-admission-webhook
webhooks:
  - name: sidecar.fuse.fluid.io
    rules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE"]
        resources:   ["pods"]
    clientConfig:
      service:
        namespace: {{ include "fluid.namespace" . }}
        name: fluid-pod-admission-webhook
        path: "/mutate-fluid-io-v1alpha1-schedulepod"
        port: 9443
      caBundle: Cg==
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    failurePolicy: Fail
    reinvocationPolicy: {{ .Values.webhook.reinvocationPolicy }}
    sideEffects: None
    admissionReviewVersions: ["v1","v1beta1"]
    objectSelector:
      matchLabels:
        serverless.fluid.io/inject: "true"
  - name: fuse.serverful.fluid.io
    rules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE"]
        resources:   ["pods"]
    clientConfig:
      service:
        namespace: {{ include "fluid.namespace" . }}
        name: fluid-pod-admission-webhook
        path: "/mutate-fluid-io-v1alpha1-schedulepod"
        port: 9443
      caBundle: Cg==
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    failurePolicy: Fail
    reinvocationPolicy: {{ .Values.webhook.reinvocationPolicy }}
    sideEffects: None
    admissionReviewVersions: ["v1","v1beta1"]
    objectSelector:
      matchLabels:
        fuse.serverful.fluid.io/inject: "true"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: fluid-cacheruntime-validating-webhook
webhooks:
  # Rejects an update of a CacheRuntime that changes a spec field the controller
  # cannot apply to the running components. Only the main resource is matched:
  # status and scale writes go through their subresources and are never checked.
  - name: update.cacheruntime.fluid.io
    rules:
      - apiGroups:   ["data.fluid.io"]
        apiVersions: ["v1alpha1"]
        operations:  ["UPDATE"]
        resources:   ["cacheruntimes"]
    clientConfig:
      service:
        namespace: {{ include "fluid.namespace" . }}
        name: fluid-pod-admission-webhook
        path: "/validate-data-fluid-io-v1alpha1-cacheruntime"
        port: 9443
      caBundle: Cg==
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    failurePolicy: {{ .Values.webhook.cacheRuntimeValidation.failurePolicy }}
    sideEffects: None
    admissionReviewVersions: ["v1","v1beta1"]
{{- end }}
