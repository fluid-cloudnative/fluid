name: E2E Functionality Check
on:
  pull_request:
    branches: [ master, release-* ]
    paths-ignore:
      - 'docs/**'
      - 'addons/**'
      - 'sdk/**'
      - 'static/**'

# Declare default permissions as read only.
permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.10

jobs:
  kind-e2e-test:
    # ubuntu-latest resolves to ubuntu-26.04, whose host AppArmor fusermount3 profile
    # denies the JindoRuntime FUSE mounts (#6224); the profile is unloaded from the
    # ephemeral runner in a step below before the Kind cluster is created.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.33.2", "v1.30.13", "v1.28.15", "v1.24.17", "v1.22.17"]
    env:
      GOPATH: ${{ github.workspace }}
      GO111MODULE: auto
      KIND_CLUSTER: fluid-cluster
    defaults:
      run:
        working-directory: ${{ env.GOPATH }}/src/github.com/fluid-cloudnative/fluid

    steps:
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.GOPATH }}/src/github.com/fluid-cloudnative/fluid

      - name: Cache Kind and kubectl binaries
        uses: actions/cache@v6
        with:
          path: ${{ env.RUNNER_TOOL_CACHE }}/kind/v0.31.0
          key: ${{ runner.os }}-kind-v0.31.0-kubectl-${{ matrix.kubernetes-version }}

      - name: Unload AppArmor fusermount3 profile from the host runner
        # ubuntu-26.04 runners ship AppArmor 5.0 with an /etc/apparmor.d/fusermount3
        # profile. It attaches by path to /usr/bin/fusermount3 even when the calling
        # process (a privileged FUSE pod on the Kind node) is otherwise unconfined,
        # and only allows FUSE mounts under /mnt, /tmp, $HOME and a few more
        # directories - so the JindoRuntime FUSE mount fails with EACCES (#6224).
        # The runner is ephemeral and single-tenant, so simply unload the profile
        # before the Kind cluster is created. On ubuntu-24.04 and older images,
        # which do not ship the profile, this is a no-op.
        run: |
          if [[ ! -f /etc/apparmor.d/fusermount3 ]]; then
            echo ">>> no /etc/apparmor.d/fusermount3 on this runner image, nothing to do"
            exit 0
          fi
          echo ">>> fusermount3 profile found, unloading it"
          sudo aa-status 2>/dev/null | grep -i fusermount || true
          if ! sudo apparmor_parser -R /etc/apparmor.d/fusermount3; then
            echo ">>> failed to unload /etc/apparmor.d/fusermount3; without it the JindoRuntime FUSE e2e hangs until the step timeout (#6224)" >&2
            exit 1
          fi
          echo ">>> fusermount3 profile unloaded"

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.31.0  # default version in v1.12.0 is v0.24.0, bump to v0.29.0 to solve https://github.com/kubernetes-sigs/kind/issues/3853
          node_image: kindest/node:${{ matrix.kubernetes-version }}
          cluster_name: ${{ env.KIND_CLUSTER }}
          kubectl_version: ${{ matrix.kubernetes-version }}

      - name: Free disk space
        run: |
          echo ">>> System disk usage before cleanup"
          df -h
          # Remove large pre-installed tools to free disk space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker image prune -a -f
          echo ">>> System disk usage after cleanup"
          df -h

      - name: Build fluid docker images
        env:
          IMG_REPO: fluidcloudnative
          # The e2e suites in test/gha-e2e need the oss-emulator and mooncake
          # helper images; the backward-compatibility workflow does not.
          WITH_E2E_TEST_IMAGES: "true"
        run: |
          echo ">>> System disk usage before build fluid images"
          df -h
          ./.github/scripts/build-all-images.sh 

      - name: Deploy fluid to Kind cluster
        run: |
          ./.github/scripts/deploy-fluid-to-kind.sh

      - name: Fluid basic e2e tests
        timeout-minutes: 30
        run: |
          ./.github/scripts/gha-e2e.sh

      - name: Dump environment
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gha-e2e-logs-${{ github.job }}-${{ matrix.kubernetes-version }}
          path: "src/github.com/fluid-cloudnative/fluid/e2e-tmp/testcase-*.tgz"
          retention-days: 14
          